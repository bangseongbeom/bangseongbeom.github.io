# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.author.name }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Bang Seongbeom
author:
  name: 방성범 (Bang Seongbeom)
  email: bangseongbeom@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Bang Seongbeom's tech blog.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://www.bangseongbeom.com" # the base hostname & protocol for your site, e.g. http://example.com
repository: bangseongbeom/bangseongbeom.github.io
google_analytics: G-P5S28YZ348
giscus:
  repo: bangseongbeom/bangseongbeom.github.io
  repo_id: MDEwOlJlcG9zaXRvcnk5MjM1NjAyNQ==
  category: Comments
  category_id: DIC_kwDOBYE9uc4Ct9yc

# Build settings
permalink: /:categories/:title
defaults:
  - scope:
      path: ""
    values:
      image: /ogp.png
theme: minima
minima:
  skin: auto
  nav_pages: []
  social_links:
    - title: Repository at GitHub
      icon: github
      url: "https://github.com/bangseongbeom/bangseongbeom.github.io"
  show_excerpts: true
  show_post_site_author: true
  show_post_links: true
plugins:
  - jekyll-default-layout
  - jekyll-feed
  - jekyll-gfm-admonitions
  - jekyll-github-metadata
  - jekyll-optional-front-matter
  - jekyll-paginate-v2
  - jekyll-postfiles
  - jekyll-readme-index
  - jekyll-redirect-from
  - jekyll-relative-links
  - jekyll-sitemap
  - jekyll-titles-from-headings
pagination:
  enabled: true
  per_page: 20
  permalink: /page-:num
  title: ":title"
  sort_reverse: true
kramdown:
  parse_block_html: true
readme_index:
  with_frontmatter: true
relative_links:
  collections: true
titles_from_headings:
  strip_title: true
  collections: true

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
